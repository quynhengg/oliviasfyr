<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hover Image - Internal CSS</title>
    <style>
        .image-box {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .image1 {
            width: 100%;
            height: 100%;
            display: block;
        }

        .image2 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .image-box:hover .image2 {
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="image-box">
    <img src="https://static.wikia.nocookie.net/steven-universe/images/1/12/StevenUniverse16_-2-_By_TheOffColors.png/revision/latest/scale-to-width-down/1200?cb=20250906011246" class="image1" alt="Image 1">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTo3DF-eofru8uhWiseCisPMRwBB24m2rnWgA&s" class="image2" alt="Image 2">
</div>

</body>
</html>
